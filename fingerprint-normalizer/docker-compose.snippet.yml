# In die bestehende Compose-Datei einfuegen (dort, wo n8n & Postgres schon
# stehen), nicht als eigenstaendige Datei betreiben -- automation_bridge
# muss dasselbe Netz sein, das n8n/Postgres schon nutzen.

services:
  fingerprint-normalizer:
    build: ./fingerprint-normalizer
    container_name: fingerprint-normalizer
    restart: unless-stopped
    command: ["follow"]
    networks:
      - automation_bridge
      -n8n_n8n-net
    environment:
      TZ: Europe/Berlin
      PG_HOST: n8n-postgres          # Servicename im automation_bridge-Netz -- pruefen, falls Postgres anders heisst
      PG_PORT: "5432"
      PG_DB: n8n                 # bestaetigt 2026-08-21
      PG_USER: monitoring_mcp    # bestaetigt: hat SELECT/INSERT/UPDATE auf allen drei Tabellen, kein eigener User noetig
      PG_PASSWORD_FILE: /run/secrets/monitoring_mcp_pg_password
      DB_SCHEMA: monitoring       # bestaetigt 2026-08-21 (nicht public)
      EVENTS_TABLE: events              # bestaetigt (unter DB_SCHEMA.events)
      EVENTS_ID_COL: id                 # bestaetigt
      EVENTS_TS_COL: timestamp          # bestaetigt
      EVENTS_HOST_COL: host             # bestaetigt
      EVENTS_PROGRAM_COL: program       # bestaetigt
      EVENTS_MESSAGE_COL: message       # bestaetigt
      BACKFILL_SINCE_DAYS: "90"
      BATCH_SIZE: "2000"
      FOLLOW_BATCH_SIZE: "500"
      FOLLOW_INTERVAL_SECONDS: "300"
      LARGE_BATCH_THRESHOLD: "2000"
      # Phase 1 -- LLM-Triage (nur relevant fuer den "triage"-Modus, s.u.)
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      TRIAGE_MODEL: claude-sonnet-5
      TRIAGE_BATCH_SIZE: "20"
      TRIAGE_MAX_PER_RUN: "60"
    secrets:
      - monitoring_mcp_pg_password
      - anthropic_api_key

secrets:
  monitoring_mcp_pg_password:
    file: ./secrets/monitoring_mcp_pg_password.txt   # Passwort von monitoring_mcp eintragen, nicht ins Git-Repo aufnehmen
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt   # API-Key eintragen, nicht ins Git-Repo aufnehmen

networks:
  automation_bridge:
    external: true
  n8n_n8n-net:
    external: true
# Erstlauf (einmalig, ausserhalb der Nachtruhe 23:45-04:00):
#   docker compose build fingerprint-normalizer
#   docker compose run --rm fingerprint-normalizer backfill --since-days 90
#
# Danach normal hochfahren, uebernimmt laufend weiter:
#   docker compose up -d fingerprint-normalizer
#
# Nach einem Normalisierer-Versionswechsel (CLEANER_VERSION/NORMALIZER_VERSION
# in normalizer.py erhoehen, Image neu bauen), einmalig:
#   docker compose run --rm fingerprint-normalizer migrate --dry-run
#   docker compose run --rm fingerprint-normalizer migrate
#
# Phase 1 -- LLM-Triage, EINMALIGER Testlauf ohne Schreibvorgang:
#   docker compose run --rm fingerprint-normalizer triage --dry-run
#
# Danach als naechtlicher Batch per Host-Crontab (nicht als eigener
# "restart: unless-stopped"-Service -- der Job soll einmal laufen und
# beenden, nicht dauerhaft einen Container besetzen). Ausserhalb der
# Nachtruhe waehlen, z.B. 04:30 Uhr:
#   30 4 * * * cd /pfad/zur/compose-datei && docker compose run --rm fingerprint-normalizer triage >> /var/log/fingerprint-triage.log 2>&1
#
# Hinweis: fingerprints und event_fingerprints existieren bereits in der DB
# (angelegt vor diesem Snippet, vermutlich ueber 001_create_fingerprints.sql
# und 002_event_fingerprints.sql per Hand ausgefuehrt) -- die beiden SQL-
# Dateien liegen trotzdem bei, fuer den Fall, dass die Tabellen woanders
# (Test-/Staging-Umgebung) neu angelegt werden muessen. Erst 001, dann 002.
# 005_llm_triage_review.sql (Phase 1) manuell in pgAdmin ausfuehren, bevor
# der "triage"-Modus zum ersten Mal laeuft -- ohne die Migration schlaegt
# das UPDATE auf die neue Spalte llm_vorschlag fehl.
